<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="errorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#040a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.1)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.6)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#errorBg)"/>

  <!-- Subtle Cyber Cross Lines -->
  <path d="M0 0L800 450M800 0L0 450" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1.5"/>

  <!-- Card Frame Placeholder -->
  <rect x="250" y="85" width="300" height="200" rx="16" fill="rgba(0, 240, 255, 0.03)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Image Load Error Vector Graphic -->
  <!-- Photo Outline -->
  <rect x="310" y="125" width="180" height="120" rx="8" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
  
  <!-- Glowing Sun / Node -->
  <circle cx="445" cy="155" r="14" fill="rgba(168, 85, 247, 0.5)" stroke="rgba(168, 85, 247, 0.8)" stroke-width="1.5"/>

  <!-- Mountain / Wave Vectors -->
  <path d="M320 225L365 175L400 210L435 165L480 225Z" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.6)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Warning Cross Line over Image -->
  <line x1="330" y1="135" x2="470" y2="235" stroke="rgba(244, 63, 94, 0.5)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Tech Status Divider -->
  <line x1="200" y1="315" x2="600" y2="315" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- Text Headlines -->
  <text x="400" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="3">IMAGE LOAD ERROR / PREVIEW OFFLINE</text>
  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.55)" text-anchor="middle" letter-spacing="1.5">OWASP MANIT CYBERSECURITY CONSORTIUM</text>
</svg>
