<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Subtle High-tech grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <path d="M 0,25 L 400,25 M 0,50 L 400,50 M 0,75 L 400,75 M 0,100 L 400,100 M 0,125 L 400,125 M 0,150 L 400,150 M 0,175 L 400,175 M 0,200 L 400,200 M 0,225 L 400,225" />
    <path d="M 50,0 L 50,250 M 100,0 L 100,250 M 150,0 L 150,250 M 200,0 L 200,250 M 250,0 L 250,250 M 300,0 L 300,250 M 350,0 L 350,250" />
  </g>

  <!-- Generic landscape/photo placeholder icon with a glow -->
  <g filter="url(#glow)" transform="translate(160, 60)">
    <!-- Photo Frame -->
    <rect x="0" y="0" width="80" height="60" rx="8" ry="8" fill="none" stroke="url(#glow-grad)" stroke-width="2"/>
    <!-- Mountains -->
    <path d="M 8,48 L 35,22 L 54,39 L 72,20" fill="none" stroke="url(#glow-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sun -->
    <circle cx="56" cy="18" r="5" fill="none" stroke="url(#glow-grad)" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="200" y="165" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#00e5ff" letter-spacing="1.5" text-anchor="middle" opacity="0.9">
    PREVIEW UNAVAILABLE
  </text>
  <text x="200" y="188" font-family="'Syne', 'Inter', sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.4)" text-anchor="middle">
    No media assets loaded
  </text>
</svg>
