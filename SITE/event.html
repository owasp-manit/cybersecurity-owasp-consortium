<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="event-case-study-page">

    <div class="ambient__orb ambient__orb--c"></div>
    <div class="ambient__grid"></div>
    <div class="ambient__noise"></div>

  <header class="header" id="top">
    <div class="header__inner container">
      <a class="header__brand" href="./home.html" aria-label="OWASP MANIT Home">
        <div class="brand__logomark">
          <img src="../logo_owasp.png" alt="OWASP">
        </div>
        <div class="brand__text">

          <strong class="brand__name">MANIT</strong>

      <nav class="header__nav" aria-label="Primary navigation">

    <section class="events-page section">
      <div class="container">
        <div id="detail-root"></div>
      </div>
    </section>
