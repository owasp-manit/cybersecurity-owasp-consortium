  <style id="pl-critical">
    html.pl-lock, html.pl-lock body { overflow: hidden; }
    #preloader { position: fixed; inset: 0; z-index: 99999; color: #fff; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
    #preloader .pl-half { position: absolute; left: 0; right: 0; height: 50.5%; background: #000; transition: transform .8s cubic-bezier(.76, 0, .24, 1); }
    #preloader .pl-top { top: 0; }
    #preloader .pl-bottom { bottom: 0; }
    #preloader.pl-exit .pl-top { transform: translateY(-101%); }
    #preloader.pl-exit .pl-bottom { transform: translateY(101%); }
    #pl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .3s; }
    #preloader .pl-hud { position: absolute; inset: 0; pointer-events: none; transition: opacity .3s; }
    #preloader.pl-exit #pl-canvas, #preloader.pl-exit .pl-hud { opacity: 0; }
    .pl-count { position: absolute; top: 24px; left: 28px; font-size: 13px; letter-spacing: .2em; }
    .pl-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); }
    .pl-skip { position: absolute; top: 14px; right: 18px; width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; cursor: pointer; pointer-events: auto; }
    .pl-skip:hover { background: #fff; color: #000; }
    .pl-skip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>

      </button>
      <div class="pl-bar"></div>
    </div>
  </div>

      if (p) { p.remove(); document.documentElement.classList.remove('pl-lock'); window.__preloaderDone = true; }
